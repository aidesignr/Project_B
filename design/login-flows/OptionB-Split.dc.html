<div class="ak-root" data-theme="{{theme}}" lang="{{lang}}" dir="{{dir}}" style="min-height: 800px; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--fg); font-family: {{font}}">

              <a href="Flow2-ForgotPassword.dc.html" style="font-size: 14px; line-height: 20px">{{t.forgot}}</a>
            </div>
            <div style="position: relative">
              <input id="b-password" type="{{eye1.type}}" autocomplete="current-password" style="width: 100%; height: 32px; box-sizing: border-box; padding-block: 0; padding-inline: 12px 36px; background: var(--input-bg); color: var(--fg); border: 1px solid var(--input); border-radius: 8px; font-size: 14px; line-height: 20px; font-family: inherit">
              <button type="button" class="has-tip" data-tip="{{eye1.tip}}" aria-label="{{eye1.tip}}" aria-pressed="{{eye1.shown}}" onClick="{{eye1.toggle}}" style="position: absolute; inset-inline-end: 4px; top: 4px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); border: 0; border-radius: 4px; cursor: pointer">

          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">{{t.newHere}} <a href="Flow8-SignUp.dc.html" style="font-weight: 500">{{t.createAccount}}</a></p>

        </div>
      </div>
    </div>

    <nav aria-label="{{t.legal}}" style="display: flex; justify-content: center; gap: 16px; font-size: 12px; line-height: 16px">
      <a href="#">{{t.privacy}}</a>
      <a href="#">{{t.terms}}</a>
      <a href="#">{{t.help}}</a>
    </nav>
  </main>
</div>

      paneLayout: this.props.paneLayout || 'frame'
    };
  }
}
