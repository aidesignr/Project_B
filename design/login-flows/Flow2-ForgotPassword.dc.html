<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset your password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.ak-root[data-theme="dark"]{color-scheme:dark;--bg:#030712;--fg:#f9fafb;--muted:#9ca3af;--divider:#1f2937;--ctrl-border:#374151;--seg-on:#1f2937;--input-bg:#030712;--input:#737b8a;--primary:#1e6fe8;--on-primary:#ffffff;--link:#6aa8ff;--link-hover:#8fbcff;--ring:#4d94ff;--accent-bg:#13233d;--accent-fg:#8fbcff;--ok-bg:#11291b;--ok-fg:#6fd896;--track:#374151;--well:#030712;--readonly-bg:#1f2937}
.ak-root[data-theme="light"]{color-scheme:light;--bg:#ffffff;--fg:#000000;--muted:#4b5563;--divider:#e5e7eb;--ctrl-border:#d1d5db;--seg-on:#f3f4f6;--input-bg:#ffffff;--input:#868c98;--primary:#1565d8;--on-primary:#ffffff;--link:#0f5bc4;--link-hover:#0b4aa0;--ring:#1565d8;--accent-bg:#eaf2fd;--accent-fg:#0f5bc4;--ok-bg:#e8f6ed;--ok-fg:#126b34;--track:#d1d5db;--well:#f9fafb;--readonly-bg:#f3f4f6}
.ak-root[data-theme="dark"]{--err-bg:#3a1417;--err-fg:#ff8b8f;--err-border:#c9434a}
.ak-root[data-theme="light"]{--err-bg:#fdecec;--err-fg:#b4161f;--err-border:#d9545b}
.ak-root a{color:var(--link);text-decoration:underline}.ak-root a:hover{color:var(--link-hover)}
.ak-root :is(button,input,select,a):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ak-root input::placeholder{color:var(--muted)}
.ak-root:is(:lang(ar),:lang(ja)) main :is(p,label,a,button,span,li){line-height:24px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ak-root[data-theme="dark"]{--tip-bg:#f9fafb;--tip-fg:#030712}
.ak-root[data-theme="light"]{--tip-bg:#111827;--tip-fg:#f9fafb}
.has-tip{position:relative}
.has-tip::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 8px;border-radius:4px;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;line-height:16px;font-weight:500;font-family:inherit;pointer-events:none;opacity:0;transition:opacity 120ms;z-index:20}
.has-tip:hover::after,.has-tip:focus-visible::after{opacity:1}
@media (prefers-reduced-motion: reduce){.has-tip::after{transition:none}}
.stack-card{position:absolute;inset:0;transition:transform 320ms cubic-bezier(.2,0,0,1),opacity 320ms cubic-bezier(.2,0,0,1)}
@media (prefers-reduced-motion: reduce){.stack-card{transition:none}}
</style>
</helmet>
<div class="ak-root" data-theme="{{theme}}" lang="{{lang}}" dir="{{dir}}" style="min-height: 800px; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--fg); font-family: {{font}}">
  <div style="flex: 1 1 560px; min-width: 0; display: flex">
    <dc-import name="MarketingPane" theme="{{theme}}" lang="{{lang}}" hint-size="100%,800px" style="width: 100%"></dc-import>
  </div>

  <main style="flex: 1 1 560px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px; padding: 24px 24px 32px">
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
        <label for="f2-lang" class="sr-only">{{t.language}}</label>
        <select id="f2-lang" value="{{lang}}" onChange="{{setLang}}" style="height: 32px; box-sizing: border-box; padding: 0 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--input); border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; font-family: inherit; cursor: pointer">
          <option value="en" lang="en">English</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </div>
      <div role="radiogroup" aria-label="{{t.theme}}" style="display: flex; gap: 4px; padding: 4px; border: 1px solid var(--ctrl-border); border-radius: 8px">
        <sc-for list="{{themes}}" as="opt" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{opt.checked}}" aria-label="{{opt.label}}" class="has-tip" data-tip="{{opt.label}}" onClick="{{opt.pick}}" style="{{opt.style}}">
            <sc-if value="{{opt.isLight}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
            </sc-if>
            <sc-if value="{{opt.isDark}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            </sc-if>
            <sc-if value="{{opt.isSystem}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
      <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
        <a href="OptionB-Split.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; text-decoration: none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{flip}}"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
          {{t.back}}
        </a>

        <sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 24px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">{{t.title}}</h1>
              <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">{{t.body}}</p>
            </div>
            <sc-if value="{{banner.show}}" hint-placeholder-val="{{false}}">
              <div role="alert" style="display: flex; gap: 12px; padding: 12px 16px; background: var(--err-bg); border: 1px solid var(--err-border); border-radius: 8px">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px; color: var(--err-fg)"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600">{{banner.title}}</p>
                  <p style="margin: 0; font-size: 14px; line-height: 20px">{{banner.body}}</p>
                </div>
              </div>
            </sc-if>
            <form style="display: flex; flex-direction: column; gap: 12px; margin: 0">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="fp-email" style="font-size: 14px; line-height: 20px; font-weight: 500">{{t.email}} <span aria-hidden="true" style="color: var(--err-fg)">*</span></label>
                <input id="fp-email" type="email" dir="ltr" autocomplete="username" placeholder="name@company.com" style="height: 32px; box-sizing: border-box; padding: 0 12px; background: var(--input-bg); color: var(--fg); border: 1px solid var(--input); border-radius: 8px; font-size: 14px; line-height: 20px; font-family: inherit; text-align: start">
              </div>
              <button type="button" onClick="{{send}}" style="margin-top: 4px; height: 32px; background: var(--primary); color: var(--on-primary); border: 0; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; font-family: inherit; cursor: pointer">{{t.send}}</button>
            </form>
            <p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--muted)">{{t.sso}}</p>
          </div>
        </sc-if>

        <sc-if value="{{showSent}}" hint-placeholder-val="{{false}}">
          <div role="status" style="display: flex; flex-direction: column; gap: 16px">
            <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--ok-bg); color: var(--ok-fg); border-radius: 8px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            </div>
            <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">{{t.sentTitle}}</h1>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">{{t.sentBody}}</p>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">{{t.noEmail}}</p>
            <button type="button" onClick="{{again}}" style="align-self: flex-start; height: 32px; padding: 0 16px; background: transparent; color: var(--fg); border: 1px solid var(--ctrl-border); border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; font-family: inherit; cursor: pointer">{{t.again}}</button>
          </div>
        </sc-if>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","options":["none","sent","linkExpired"],"default":"none"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { themePref: 'dark', lang: 'en', sent: props.scenario === 'sent' }; }
  renderVals() {
    const C = {
      en: { language: 'Language', theme: 'Theme', light: 'Light', dark: 'Dark', system: 'System' },
      ar: { language: 'اللغة', theme: 'المظهر', light: 'فاتح', dark: 'داكن', system: 'حسب النظام' },
      ja: { language: '言語', theme: 'テーマ', light: 'ライト', dark: 'ダーク', system: 'システム設定' }
    };
    const P = {
      en: { back: 'Back to sign in', title: 'Reset your password', body: "Enter your work email and we'll send you a link to set a new password.", email: 'Work email', send: 'Send reset link', sso: "Signing in with Google or SSO? Reset your password with your company's identity provider instead.", sentTitle: 'Check your email', sentBody: "If an account exists for that email, we've sent a reset link. It expires in 30 minutes.", noEmail: 'No email after a few minutes? Check your spam folder.', again: 'Send it again' },
      ar: { back: 'العودة إلى تسجيل الدخول', title: 'إعادة تعيين كلمة المرور', body: 'أدخل بريدك الإلكتروني للعمل وسنرسل إليك رابطًا لتعيين كلمة مرور جديدة.', email: 'البريد الإلكتروني للعمل', send: 'إرسال رابط إعادة التعيين', sso: 'هل تسجّل الدخول باستخدام Google أو SSO؟ أعِد تعيين كلمة المرور لدى مزوّد الهوية في شركتك.', sentTitle: 'تحقّق من بريدك الإلكتروني', sentBody: 'إذا كان هناك حساب مرتبط بهذا البريد، فقد أرسلنا رابط إعادة التعيين. تنتهي صلاحيته خلال 30 دقيقة.', noEmail: 'لم يصلك بريد بعد بضع دقائق؟ تحقّق من مجلد الرسائل غير المرغوب فيها.', again: 'إعادة الإرسال' },
      ja: { back: 'サインインに戻る', title: 'パスワードをリセット', body: '仕事用メールアドレスを入力すると、新しいパスワードを設定するためのリンクをお送りします。', email: '仕事用メールアドレス', send: 'リセットリンクを送信', sso: 'Google または SSO でサインインしていますか？会社の ID プロバイダーでパスワードをリセットしてください。', sentTitle: 'メールを確認してください', sentBody: 'そのメールアドレスのアカウントが存在する場合、リセットリンクを送信しました。リンクの有効期限は 30 分です。', noEmail: '数分経ってもメールが届きませんか？迷惑メールフォルダーを確認してください。', again: '再送信' }
    };
    const E = {
      en: { expTitle: 'This reset link has expired', expBody: 'Reset links work for 30 minutes and only once. Request a new one below.' },
      ar: { expTitle: 'انتهت صلاحية رابط إعادة التعيين هذا', expBody: 'تعمل روابط إعادة التعيين لمدة 30 دقيقة ولمرة واحدة فقط. اطلب رابطًا جديدًا أدناه.' },
      ja: { expTitle: 'このリセットリンクは有効期限が切れています', expBody: 'リセットリンクの有効期間は 30 分で、使用できるのは 1 回のみです。下で新しいリンクをリクエストしてください。' }
    };
    const lang = this.state.lang;
    const t = Object.assign({}, C[lang], P[lang], E[lang]);
    const expired = (this.props.scenario || 'none') === 'linkExpired';
    const banner = { show: expired, title: t.expTitle, body: t.expBody };
    const pref = this.state.themePref;
    const osDark = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
    const theme = pref === 'system' ? (osDark ? 'dark' : 'light') : pref;
    const themes = ['light', 'dark', 'system'].map((k) => ({
      label: t[k], checked: pref === k ? 'true' : 'false',
      isLight: k === 'light', isDark: k === 'dark', isSystem: k === 'system',
      pick: () => this.setState({ themePref: k }),
      style: 'width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; cursor: pointer; color: ' + (pref === k ? 'var(--fg)' : 'var(--muted)') + '; background: ' + (pref === k ? 'var(--seg-on)' : 'transparent') + ';'
    }));
    const font = { en: "'Archivo', ui-sans-serif, system-ui, sans-serif", ar: "'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Archivo', sans-serif", ja: "'Noto Sans JP', 'Hiragino Sans', 'Archivo', sans-serif" }[lang];
    const sent = this.state.sent;
    return {
      t, lang, theme, themes, font,
      dir: lang === 'ar' ? 'rtl' : 'ltr',
      flip: lang === 'ar' ? 'transform: scaleX(-1)' : '',
      setLang: (e) => this.setState({ lang: e.target.value }),
      showForm: !sent, showSent: sent, banner,
      send: () => this.setState({ sent: true }),
      again: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
