body{margin:0}
.ak-root[data-theme="dark"]{color-scheme:dark;--bg:#030712;--fg:#f9fafb;--muted:#9ca3af;--divider:#1f2937;--ctrl-border:#374151;--seg-on:#1f2937;--input-bg:#030712;--input:#737b8a;--primary:#1e6fe8;--on-primary:#ffffff;--link:#6aa8ff;--link-hover:#8fbcff;--ring:#4d94ff;--accent-bg:#13233d;--accent-fg:#8fbcff;--ok-bg:#11291b;--ok-fg:#6fd896;--track:#374151;--well:#030712;--readonly-bg:#1f2937}
.ak-root[data-theme="light"]{color-scheme:light;--bg:#ffffff;--fg:#000000;--muted:#4b5563;--divider:#e5e7eb;--ctrl-border:#d1d5db;--seg-on:#f3f4f6;--input-bg:#ffffff;--input:#868c98;--primary:#1565d8;--on-primary:#ffffff;--link:#0f5bc4;--link-hover:#0b4aa0;--ring:#1565d8;--accent-bg:#eaf2fd;--accent-fg:#0f5bc4;--ok-bg:#e8f6ed;--ok-fg:#126b34;--track:#d1d5db;--well:#f9fafb;--readonly-bg:#f3f4f6}
.ak-root[data-theme="dark"]{--err-bg:#3a1417;--err-fg:#ff8b8f;--err-border:#c9434a}
.ak-root[data-theme="light"]{--err-bg:#fdecec;--err-fg:#b4161f;--err-border:#d9545b}
.ak-root a{color:var(--link);text-decoration:underline}.ak-root a:hover{color:var(--link-hover)}
.ak-root :is(button,input,select,a):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ak-root input::placeholder{color:var(--muted)}
.ak-root:is(:lang(ar),:lang(ja)) main :is(p,label,a,button,span,li){line-height:24px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.ak-root[data-theme="light"]{--tip-bg:#111827;--tip-fg:#f9fafb}
.has-tip{position:relative}
.has-tip::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 8px;border-radius:4px;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;line-height:16px;font-weight:500;font-family:inherit;pointer-events:none;opacity:0;transition:opacity 120ms;z-index:20}

</helmet>
<div class="ak-root" data-theme="{{theme}}" lang="{{lang}}" dir="{{dir}}" style="min-height: 800px; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--fg); font-family: {{font}}">
  <div style="flex: 1 1 560px; min-width: 0; display: flex">
    <dc-import name="MarketingPane" theme="{{theme}}" lang="{{lang}}" hint-size="100%,800px" style="width: 100%"></dc-import>
  </div>

  <main style="flex: 1 1 560px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px; padding: 24px 24px 32px">
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
        <label for="f3-lang" class="sr-only">{{t.language}}</label>
        <select id="f3-lang" value="{{lang}}" onChange="{{setLang}}" style="height: 32px; box-sizing: border-box; padding: 0 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--input); border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; font-family: inherit; cursor: pointer">
          <option value="en" lang="en">English</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </div>
      <div role="radiogroup" aria-label="{{t.theme}}" style="display: flex; gap: 4px; padding: 4px; border: 1px solid var(--ctrl-border); border-radius: 8px">
        <sc-for list="{{themes}}" as="opt" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{opt.checked}}" aria-label="{{opt.label}}" class="has-tip" data-tip="{{opt.label}}" onClick="{{opt.pick}}" style="{{opt.style}}">
            <sc-if value="{{opt.isLight}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
            </sc-if>
            <sc-if value="{{opt.isDark}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            </sc-if>
            <sc-if value="{{opt.isSystem}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
      <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
        <sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted)">{{t.step}}</p>
          <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
            <div style="height: 4px; background: var(--primary); border-radius: 9999px"></div>
            <div style="height: 4px; background: var(--track); border-radius: 9999px"></div>
            <div style="height: 4px; background: var(--track); border-radius: 9999px"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">{{t.title}}</h1>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">{{t.body}}</p>
        </div>

        <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="inv-email" style="font-size: 14px; line-height: 20px; font-weight: 500">{{t.email}}</label>
            <input id="inv-email" type="email" dir="ltr" autocomplete="username" value="[invitee@company.com]" readonly style="height: 32px; box-sizing: border-box; padding: 0 12px; background: var(--readonly-bg); color: var(--muted); border: 1px solid var(--ctrl-border); border-radius: 8px; font-size: 14px; line-height: 20px; font-family: inherit; text-align: start">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="inv-pw" style="font-size: 14px; line-height: 20px; font-weight: 500">{{t.pw}}</label>
            <div style="position: relative">
              <input id="inv-pw" placeholder="{{t.phNewPw}}" type="{{eye1.type}}" autocomplete="new-password" value="{{pwVal}}" onChange="{{noop}}" aria-invalid="{{pwErr}}" aria-required="true" aria-describedby="pw-err pw-rules" style="outline: {{ringPw}}; outline-offset: 2px; width: 100%; height: 32px; box-sizing: border-box; padding-block: 0; padding-inline: 12px 36px; background: var(--input-bg); color: var(--fg); border: 1px solid {{pwBorder}}; border-radius: 8px; font-size: 14px; line-height: 20px; font-family: inherit">
              <button type="button" class="has-tip" data-tip="{{eye1.tip}}" aria-label="{{eye1.tip}}" aria-pressed="{{eye1.shown}}" onClick="{{eye1.toggle}}" style="position: absolute; inset-inline-end: 4px; top: 4px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); border: 0; border-radius: 4px; cursor: pointer">
                <sc-if value="{{eye1.hidden}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
                <sc-if value="{{eye1.shown}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg></sc-if>
              </button>
            </div>
            <sc-if value="{{pwErr}}" hint-placeholder-val="{{false}}">
              <p id="pw-err" style="margin: 0; display: flex; align-items: flex-start; gap: 4px; font-size: 12px; line-height: {{msgLh}}; color: var(--err-fg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>{{t.weakErr}}</p>
            </sc-if>
          </div>
          <ul id="pw-rules" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: 12px; line-height: {{msgLh}}">
            <sc-for list="{{rules}}" as="rule" hint-placeholder-count="5">
              <li style="display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; line-height: {{msgLh}}; color: {{rule.color}}">
                <sc-if value="{{rule.met}}" hint-placeholder-val="{{true}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
                </sc-if>
                <sc-if value="{{rule.unmet}}" hint-placeholder-val="{{false}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg>
                </sc-if>
                <span style="overflow: hidden; text-overflow: ellipsis">{{rule.text}}<span class="sr-only"> {{rule.status}}</span></span>
              </li>
            </sc-for>
          </ul>
          <p style="margin: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 16px; color: var(--muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>{{t.breach}}</p>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="inv-pw2" style="font-size: 14px; line-height: 20px; font-weight: 500">{{t.confirm}}</label>
            <div style="position: relative">
              <input id="inv-pw2" placeholder="{{t.phConfirm}}" type="{{eye2.type}}" autocomplete="new-password" style="width: 100%; height: 32px; box-sizing: border-box; padding-block: 0; padding-inline: 12px 36px; background: var(--input-bg); color: var(--fg); border: 1px solid var(--input); border-radius: 8px; font-size: 14px; line-height: 20px; font-family: inherit">
              <button type="button" class="has-tip" data-tip="{{eye2.tip}}" aria-label="{{eye2.tip}}" aria-pressed="{{eye2.shown}}" onClick="{{eye2.toggle}}" style="position: absolute; inset-inline-end: 4px; top: 4px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); border: 0; border-radius: 4px; cursor: pointer">
                <sc-if value="{{eye2.hidden}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
                <sc-if value="{{eye2.shown}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg></sc-if>
              </button>
            </div>
          </div>
          <a href="Flow4-InviteAuthenticator.dc.html" style="height: 32px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary); text-decoration: none; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500">{{t.cont}}</a>
        </form>
        <p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--muted)">{{t.expires}} {{t.notExpecting}} <a href="#">{{t.letUs}}</a></p>
        </div>
        </sc-if>

        <sc-if value="{{showExpired}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="display: flex; flex-direction: column; gap: 16px">
            <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--err-bg); color: var(--err-fg); border-radius: 8px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path><path d="m14 14-4 4"></path><path d="m10 14 4 4"></path></svg>
            </div>
            <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">{{t.expTitle}}</h1>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">{{t.expBody}}</p>
            <a href="OptionB-Split.dc.html" style="height: 32px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary); text-decoration: none; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500">{{t.goSignIn}}</a>
          </div>
        </sc-if>
      </div>
    </div>
  </main>
</div>
</x-dc>

      en: { reqErr: 'This field is required.', emailErr: 'Enter an email address like name@company.com.', pwReq: 'Enter your password.', codeLength: 'Enter the 6-digit code from your app.', weakErr: "This password doesn't meet all the rules below.", breachedErr: 'This password has appeared in a known data breach. Choose a different one.' },
      ar: { reqErr: 'هذا الحقل مطلوب.', emailErr: 'أدخل عنوان بريد إلكتروني مثل name@company.com.', pwReq: 'أدخل كلمة المرور.', codeLength: 'أدخل الرمز المكوّن من 6 أرقام من تطبيقك.', weakErr: 'كلمة المرور هذه لا تستوفي جميع القواعد أدناه.', breachedErr: 'ظهرت كلمة المرور هذه في تسريب بيانات معروف. اختر كلمة مرور مختلفة.' },
      ja: { reqErr: 'この項目は必須です。', emailErr: 'name@company.com のような形式でメールアドレスを入力してください。', pwReq: 'パスワードを入力してください。', codeLength: 'アプリに表示される 6 桁のコードを入力してください。', weakErr: 'このパスワードは下記の条件をすべて満たしていません。', breachedErr: 'このパスワードは既知のデータ漏えいで見つかっています。別のパスワードを選んでください。' }
    };
    const lang = this.state.lang;
    const t = Object.assign({}, C[lang], P[lang], E[lang], PH[lang], M[lang]);
    const RING = '2px solid var(--ring)';
    const sc = this.props.scenario || 'none';
    const pwErr = sc === 'weak';
    const TIP = { en: { show: 'Show password', hide: 'Hide password' }, ar: { show: 'إظهار كلمة المرور', hide: 'إخفاء كلمة المرور' }, ja: { show: 'パスワードを表示', hide: 'パスワードを非表示' } }[lang];
    const eye = (k) => { const s = !!this.state[k]; return { type: s ? 'text' : 'password', tip: s ? TIP.hide : TIP.show, shown: s, hidden: !s, toggle: () => this.setState({ [k]: !s }) }; };
    // weak example "secret12": lowercase, number and length pass; uppercase and special fail
    const metFlags = pwErr ? [true, false, true, true, false] : [false, false, false, false, false];
    const rules = [t.rLower, t.rUpper, t.rNumber, t.rLength, t.rSpecial].map((text, i) => ({
      text, met: metFlags[i], unmet: !metFlags[i],
      status: metFlags[i] ? t.met : t.notMet,
      color: metFlags[i] ? 'var(--ok-fg)' : (pwErr ? 'var(--err-fg)' : 'var(--muted)')
    }));
    const pref = this.state.themePref;
    const osDark = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
    const theme = pref === 'system' ? (osDark ? 'dark' : 'light') : pref;
    const themes = ['light', 'dark', 'system'].map((k) => ({
      label: t[k], checked: pref === k ? 'true' : 'false',
      isLight: k === 'light', isDark: k === 'dark', isSystem: k === 'system',
      pick: () => this.setState({ themePref: k }),
      style: 'width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; cursor: pointer; color: ' + (pref === k ? 'var(--fg)' : 'var(--muted)') + '; background: ' + (pref === k ? 'var(--seg-on)' : 'transparent') + ';'
    }));
    const font = { en: "'Archivo', ui-sans-serif, system-ui, sans-serif", ar: "'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Archivo', sans-serif", ja: "'Noto Sans JP', 'Hiragino Sans', 'Archivo', sans-serif" }[lang];
    return {
      msgLh: lang === 'en' ? '16px' : '20px', 
      t, lang, theme, themes, font,
      dir: lang === 'ar' ? 'rtl' : 'ltr',
      setLang: (e) => this.setState({ lang: e.target.value }),
      showForm: sc !== 'expired', showExpired: sc === 'expired',
      rules, pwErr,
      pwBorder: pwErr ? 'var(--err-border)' : 'var(--input)',
      ringPw: pwErr ? RING : '0',
      pwVal: pwErr ? 'secret12' : '',
      noop: () => {},
      eye1: eye('show1'), eye2: eye('show2')
    };
  }
}
</script>
