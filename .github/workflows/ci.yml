name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, design checks and Storybook tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contrast check
        run: node scripts/check-contrast.mjs

      - name: Figma drift check
        run: node scripts/check-figma-drift.mjs

      - name: Spacing, direction and color check
        run: node scripts/check-spacing.mjs src

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook tests (dark + en, light + ar)
        run: npm run test-storybook
